[project]
name = "omv-protondrive-tooling"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tyro>=1.0",
]

[tool.uv]
package = false

[tool.ruff]
cache-dir = ".tmp/ruff_cache"
line-length = 120
src = ["src", "tools", "tools/tests", "tests/unit", "tests/integration"]
target-version = "py311" # Guest code must remain valid on Debian's Python 3.11.

[tool.ruff.format]
quote-style = "single"

[tool.basedpyright]
extraPaths = ["src", "tools", "tools/tests", "tests/unit", "tests/integration"]
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
strictGenericNarrowing = true
pythonVersion = "3.11"
pythonPlatform = "Linux"

[tool.deptry]
extend_exclude = [".tmp", "result"]

[tool.deptry.package_module_name_map]
jinja2 = "jinja2"
pyyaml = "yaml"
tyro = "tyro"
rich = "rich"
