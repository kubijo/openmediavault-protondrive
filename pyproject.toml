[project]
name = "omv-protondrive-tooling"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tyro>=1.0",
    "packaging>=26",
]

[dependency-groups]
dev = [
    "protondrive-api",
    "pytest>=9",
    "pytest-asyncio>=1",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.uv.sources]
protondrive-api = { path = "src/api" }

[tool.ruff]
cache-dir = ".tmp/ruff_cache"
line-length = 120
src = ["src", "src/api", "tools", "tools/tests", "tests/unit", "tests/integration"]
target-version = "py311" # Guest code must remain valid on Debian's Python 3.11.

[tool.ruff.format]
quote-style = "single"

[tool.basedpyright]
include = ["src", "src/bin/omv-protondrive", "tools", "tests"]
extraPaths = ["src", "src/api", "tools", "tools/tests", "tests/unit", "tests/integration"]
exclude = ["src/api/protondrive_api/v1", "src/api/buf", "**/.venv", "**/node_modules", "**/__pycache__", ".tmp"]
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"
strictGenericNarrowing = true
pythonVersion = "3.11"
pythonPlatform = "Linux"

[tool.deptry]
extend_exclude = [".tmp", "result", "^src/api(/|$)"] # API imports use their own dependency manifest.

[tool.deptry.package_module_name_map]
jinja2 = "jinja2"
pyyaml = "yaml"
tyro = "tyro"
rich = "rich"
