# Load plugin styles without modifying OMV's packaged entry point.
# Use a separate anchor from the interactive VM's </head> branding injection.
sub_filter '</title>' '</title><link rel="stylesheet" href="/protondrive.css">';

location = /protondrive.css {
    alias /usr/share/openmediavault-protondrive/protondrive.css;
    expires -1;
}

location = /protondrive-auth {
    internal;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/share/openmediavault-protondrive/auth.php;
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_pass_request_body off;
    fastcgi_pass unix:/run/php/php8.2-fpm-openmediavault-webgui.sock;
}

location ^~ /protondrive/rpc/ {
    # Browser RPCs use same-origin fetch. A custom header makes cross-origin
    # mutations require a preflight, which this location does not enable.
    if ($http_x_protondrive_request != "1") { return 403; }
    auth_request /protondrive-auth;
    auth_request_set $protondrive_user $upstream_http_x_protondrive_user;
    proxy_set_header X-Protondrive-User $protondrive_user;
    proxy_set_header X-Protondrive-Authenticated "1";
    proxy_pass http://unix:/run/omv-protondrive-api/api.sock:/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 40s;
    client_max_body_size 4m;
}

location = /protondrive { return 302 /protondrive/; }

location ^~ /protondrive/ {
    alias /usr/share/openmediavault-protondrive/web/;
    try_files $uri $uri/ /protondrive/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
