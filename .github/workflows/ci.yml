name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      run_vm:
        description: Run the disposable OMV VM integration suite
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Nix QA and Debian integration
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate
        run: nix run --no-write-lock-file .#validate
      - name: Audit secrets and dependencies
        run: nix run --no-write-lock-file .#audit -- --in-clanker
      - name: Check flake outputs
        run: nix flake check --no-write-lock-file -L --keep-going
      - name: Build Debian package
        run: nix build --no-write-lock-file .#openmediavault-protondrive -L
      - name: Test Debian runtime and keyring
        run: nix run --no-write-lock-file .#test-debian
      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: openmediavault-protondrive-amd64
          path: result/*.deb
          if-no-files-found: error
          retention-days: 7

  vm:
    name: OMV VM integration
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_vm)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Allow the runner to use KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Test OMV installation, recovery and backup restore
        run: nix run --no-write-lock-file .#test-vm -- --no-cache
      - name: Upload VM logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omv-vm-logs
          path: .tmp/vm-tests/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
